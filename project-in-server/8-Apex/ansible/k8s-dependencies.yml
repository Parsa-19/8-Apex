---
- name: Kubernetes common dependencies on all nodes
  hosts:
    - control-planes
    - workers
  become: yes
  tasks:

    - name: Install required packages
      ansible.builtin.package:
        name:
          - firewalld
          - iptables
          - iproute-tc
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: yes
        state: started


    # ----------------------------
    # Kernel Modules
    # ----------------------------

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present


    - name: Persist Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          overlay
          br_netfilter


    # ----------------------------
    # Sysctl Parameters
    # ----------------------------

    - name: Configure Kubernetes sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1


    - name: Apply sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system



    # ----------------------------
    # SELinux
    # ----------------------------

    - name: Set SELinux permissive immediately
      ansible.builtin.command:
        cmd: setenforce 0
      register: selinux_result
      failed_when: false
      changed_when: selinux_result.rc == 0


    - name: Persist SELinux permissive mode
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'



# ============================================================
# Control Plane Firewall Rules
# ============================================================

- name: Configure firewall on control planes
  hosts: control-planes
  become: yes

  tasks:

    - name: Open Kubernetes control plane ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - 6443/tcp
        - 2379-2380/tcp
        - 10250/tcp
        - 10251/tcp
        - 10252/tcp



# ============================================================
# Worker Firewall Rules
# ============================================================

- name: Configure firewall on workers
  hosts: workers
  become: yes

  tasks:

    - name: Open Kubernetes worker ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - 10250/tcp
        - 30000-32767/tcp



# ============================================================
# Load Balancer Firewall Rules
# ============================================================

- name: Configure firewall on load balancer
  hosts: lb
  become: yes

  tasks:

    - name: Enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: yes
        state: started

    - name: Open Kubernetes API load balancer port
      ansible.posix.firewalld:
        port: 6443/tcp
        permanent: yes
        immediate: yes
        state: enabled